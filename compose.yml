# Local Midnight devnet for zkperp: node (dev preset) + indexer, network ID "undeployed".
# Taken from ~/midnight-polisZK/compose.yml, without its Postgres service.
#
# The proof server is deliberately not part of this stack: it fails to fetch
# key material when started by compose. Run it once as a standalone container:
#
#   docker run -d --name proof-server --restart unless-stopped \
#     -p 6300:6300 midnightntwrk/proof-server:8.1.0 midnight-proof-server -v

name: zkperp

services:
  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    # On a fresh chain the indexer can start before block 1 exists and exit; retry.
    restart: on-failure
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy
